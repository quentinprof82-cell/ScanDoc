<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/camera.css"><link rel="stylesheet" href="css/responsive.css"><title>Scan &amp; Go</title></head><body>
<div id="app"><header class="topbar"><div class="brand"><img src="icons/icon-192.png" class="brand-logo" alt=""><div><h1>Scan &amp; Go</h1><p>Scannez · Enregistrez · Partagez</p></div></div><button class="icon-btn" id="settingsBtn">⚙</button></header>
<main id="homeView" class="view active"><button class="hero-scan" id="startScanBtn"><span class="hero-camera">▣</span><span class="hero-copy"><strong>Scanner un document</strong><small>Photo → recadrage → PDF → partage</small></span><span class="hero-arrow">›</span></button><section class="quick-grid"><button class="quick-card" id="newScan"><span>＋</span><b>Nouveau<br>scan</b></button><button class="quick-card" id="lastPdf"><span>PDF</span><b>Dernier<br>PDF</b></button><button class="quick-card" id="shareLast"><span>➤</span><b>Partager<br>dernier scan</b></button><button class="quick-card" id="importBtn"><span>▧</span><b>Importer<br>une image</b></button></section><section><div class="section-head"><h2>Mes scans récents</h2><button id="allScans">Voir tout ›</button></div><div id="recentList" class="recent-list"></div><div id="emptyRecent" class="empty-state">Aucun scan pour le moment.</div></section></main>
<main id="scansView" class="view"><div class="page-title"><h2>Mes scans</h2><button id="newScan2" class="small-primary">＋ Nouveau</button></div><div id="allScansList" class="all-scans-list"></div><div id="emptyAll" class="empty-state">Aucun document enregistré.</div></main>
<main id="settingsView" class="view"><div class="page-title"><h2>Paramètres</h2></div><div class="settings-card"><label class="setting-row"><span>Qualité PDF</span><select id="quality"><option value="high">Haute</option><option value="medium">Équilibrée</option><option value="small">Petite taille</option></select></label><label class="setting-row"><span>Mode de numérisation</span><select id="mode"><option value="document">Document N&amp;B</option><option value="gray">Niveaux de gris</option><option value="color">Couleur</option></select></label><label class="setting-row"><span>Détection automatique des coins</span><input id="autoDetect" type="checkbox" checked></label><div class="privacy-note"><b>🔒 Vos documents restent sur cet appareil.</b><br>Aucun compte ni serveur de stockage.</div><button id="clearAll" class="danger-btn">Supprimer tous les scans</button></div></main>
<nav class="bottom-nav"><button class="nav-item active" data-view="homeView"><span>⌂</span><small>Accueil</small></button><button class="nav-item" data-view="scansView"><span>▱</span><small>Mes scans</small></button><button class="nav-item" data-view="settingsView"><span>⚙</span><small>Paramètres</small></button></nav></div><input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://docs.opencv.org/4.x/opencv.js"></script><script type="module" src="js/app.js"></script></body></html>
